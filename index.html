<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Navigation */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 30px;
        }

        header a {
            text-decoration: none;
            color: rgba(0,0,0,0.87);
            font-size: 13px;
            margin-left: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; /* Slight offset upward for aesthetic balance */
        }

        /* Google Logo */
        .logo {
            font-size: 90px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: -2px;
        }
        .blue { color: #4285F4; }
        .red { color: #EA4335; }
        .yellow { color: #FBBC05; }
        .green { color: #34A853; }

        /* Search Form styling */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 584px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }

        /* Rounded and centered search bar */
        .search-bar {
            width: 100%;
            padding: 13px 20px;
            font-size: 16px;
            border: 1px solid #dee1e5;
            border-radius: 24px;
            outline: none;
            box-sizing: border-box;
        }

        .search-bar:hover, .search-bar:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <a href="image.html">Image Search</a>
        <a href="advanced.html">Advanced Search</a>
    </header>

    <div class="main-content">
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <form action="https://google.com/search" method="GET">
            <div class="search-wrapper">
                <input type="text" name="q" class="search-bar" autofocus required>
            </div>
            <div class="button-group">
                <input type="submit" value="Google Search" class="btn">
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
            </div>
        </form>
    </div>

</body>
</html>
