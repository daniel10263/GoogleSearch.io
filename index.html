<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google la guerra de los Clones</title>
    <style>
        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* Star Wars Deep Space Background with CSS Stars */
            background-color: #000;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: #FFE81F; /* Classic Star Wars Yellow */
            overflow: hidden;
        }

        /* Top Navigation */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 30px;
        }

        header a {
            text-decoration: none;
            color: #FFE81F;
            font-size: 13px;
            margin-left: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: text-shadow 0.3s ease;
        }

        header a:hover {
            text-shadow: 0 0 8px #FFE81F;
            text-decoration: none;
        }

        /* Main Container */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px;
        }

        /* Star Wars Style Logo */
        .logo {
            font-size: 65px;
            font-weight: 900;
            margin-bottom: 35px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 0.9;
            color: #000;
            -webkit-text-stroke: 2px #FFE81F;
            filter: drop-shadow(0 0 10px rgba(255, 232, 31, 0.5));
            transform: perspective(300px) rotateX(15deg); /* Subtle iconic crawl tilt */
        }
        
        .sub-logo {
            display: block;
            font-size: 28px;
            letter-spacing: 6px;
            margin-top: 5px;
        }

        /* Search Form styling */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 584px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }

        /* Lightsaber Inspired Search Bar */
        .search-bar {
            width: 100%;
            padding: 13px 20px;
            font-size: 16px;
            background-color: rgba(20, 20, 20, 0.85);
            border: 2px solid #555;
            border-radius: 24px;
            outline: none;
            box-sizing: border-box;
            color: #fff;
            font-family: Arial, sans-serif;
            transition: all 0.3s ease;
        }

        /* Active Lightsaber Glow (Jedi Blue) */
        .search-bar:hover, .search-bar:focus {
            border-color: #2e67f8;
            box-shadow: 0 0 15px #2e67f8, inset 0 0 5px #2e67f8;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: #1a1a1a;
            border: 2px solid #FFE81F;
            border-radius: 4px;
            color: #FFE81F;
            font-family: 'Arial Black', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        /* Sith Red hover effect */
        .btn:hover {
            background-color: #FFE81F;
            color: #000;
            box-shadow: 0 0 15px #FFE81F;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <a href="image.html">Image Search</a>
        <a href="advanced.html">Advanced Search</a>
    </header>

    <div class="main-content">
        <div class="logo">
            Google Clone
            <span class="sub-logo">Search</span>
        </div>

        <form action="https://google.com/search" method="GET">
            <div class="search-wrapper">
                <input type="text" name="q" class="search-bar" autofocus required>
            </div>
            <div class="button-group">
                <input type="submit" value="Google Search" class="btn">
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
            </div>
        </form>
    </div>

</body>
</html>
