<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎪 Google Clown Search 🎪</title>
    <style>
        body {
            /* Comic font and polka dot background for total circus immersion */
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            margin: 0;
            padding: 0;
            color: #111;
            background-color: #ffe600;
            background-image: radial-gradient(#ff2a2a 15%, transparent 16%),
                              radial-gradient(#00a2ff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* Top Header Area */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #ff2a2a;
            border-bottom: 8px dashed #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .title {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #00a2ff, -1px -1px 0px #000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Red clown nose in the header */
        .title::before {
            content: "🔴";
            font-size: 32px;
            animation: honk 0.5s infinite alternate;
        }

        header a {
            text-decoration: none;
            color: #fff;
            background-color: #00a2ff;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            border: 3px solid #fff;
        }

        header a:hover {
            background-color: #00ccff;
            transform: scale(1.1) rotate(-5deg);
        }

        /* Content Structure */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 10px solid #00a2ff;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
